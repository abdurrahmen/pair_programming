<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}StudentHub{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fb;
            color: #20243a;
            min-height: 100vh;
        }

        nav {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9ebf2;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            color: #635bdb;
        }

        nav a {
            text-decoration: none;
            color: #656a80;
            font-size: 14px;
            font-weight: 600;
            margin-left: 25px;
        }

        nav a:hover {
            color: #635bdb;
        }

        .container {
            width: 84%;
            max-width: 1100px;
            margin: 55px auto;
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #85899b;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(30,35,80,0.05);
            border: 1px solid #eceef5;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #635bdb;
            color: white;
            padding: 13px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #5149c4;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #eeedff;
            color: #635bdb;
        }

        .btn-secondary:hover {
            background: #e1dfff;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e1e3ec;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #635bdb;
            box-shadow: 0 0 0 3px rgba(99,91,219,0.12);
        }

        .flash {
            padding: 15px 18px;
            border-radius: 9px;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .flash.error {
            background: #fff0f0;
            color: #d34242;
            border: 1px solid #ffd5d5;
        }

        .flash.success {
            background: #eafaf1;
            color: #16844a;
            border: 1px solid #c9f0d9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 1px solid #eceef5;
            padding: 25px;
            border-radius: 14px;
        }

        .stat-card h2 {
            font-size: 30px;
            color: #635bdb;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #85899b;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 18px 14px;
            border-bottom: 1px solid #eff0f5;
            font-size: 14px;
        }

        th {
            color: #85899b;
            font-size: 12px;
            text-transform: uppercase;
        }

        .student-id {
            background: #eeedff;
            color: #635bdb;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #85899b;
        }

        @media(max-width: 650px) {

            nav {
                padding: 18px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 12px;
            }

            .container {
                width: 90%;
                margin: 35px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
                overflow-x: auto;
            }
        }

    </style>
</head>

<body>

    <nav>

        <div class="logo">StudentHub.</div>

        <div>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('show_students') }}">Students</a>
            <a href="{{ url_for('add_student') }}">Add Student</a>
        </div>

    </nav>

    <div class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

        {% block content %}{% endblock %}

    </div>

</body>
</html>
