{% macro form_field(label, name, type="text", placeholder="", value="") %}

<div class="form-group">

    <label for="{{ name }}">{{ label }}</label>

    <input
        type="{{ type }}"
        id="{{ name }}"
        name="{{ name }}"
        placeholder="{{ placeholder }}"
        value="{{ value }}"
        required
    >

</div>

{% endmacro %}
